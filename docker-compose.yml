# =============================================================================
# Taskyn Docker Compose — Production
# Pull and run: docker compose up -d
# =============================================================================

services:
  # MCP Server - handles all data operations via MCP protocol
  taskyn-core:
    image: kaushikhazra/taskyn-core:latest
    container_name: taskyn-core
    ports:
      - "8020:8020"
    volumes:
      - taskyn-data:/data
    environment:
      - TASKYN_DB=/data/taskyn.db
      - TASKYN_ACTOR=web
      - TASKYN_MCP_HOST=0.0.0.0
      - TASKYN_MCP_PORT=8020
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8020)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Web Server - REST API bridge + Frontend assets
  taskyn-web:
    image: kaushikhazra/taskyn-web:latest
    container_name: taskyn-web
    ports:
      - "3020:3020"
    volumes:
      - taskyn-web-data:/data
    environment:
      - TASKYN_MCP_URL=http://taskyn-core:8020/mcp
      - TASKYN_DB=/data/users.db
      - TASKYN_JWT_SECRET=${TASKYN_JWT_SECRET:-change-me-in-production-min-32-chars}
      - TASKYN_CORS_ORIGINS=http://localhost:3020
      - TASKYN_RATE_LIMIT=true
    depends_on:
      taskyn-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  taskyn-data:
    driver: local
  taskyn-web-data:
    driver: local
