# =============================================================================
# Taskyn Docker Compose - HTTPS Configuration
# Uses Caddy for automatic TLS with Let's Encrypt or self-signed certs
# =============================================================================
#
# Usage:
#   Local (self-signed):  docker-compose -f docker-compose.https.yml up -d
#   Production:           DOMAIN=mcp.example.com docker-compose -f docker-compose.https.yml up -d
#
# Access: https://localhost:8030/mcp
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Taskyn MCP Server (internal only)
  # ---------------------------------------------------------------------------
  taskyn:
    build: .
    image: taskyn:latest
    container_name: taskyn

    # Internal only - Caddy handles external traffic
    expose:
      - "8020"

    # Volume mount for persistent database storage
    volumes:
      - ./data:/data

    # Environment configuration
    environment:
      - TASKYN_DB=/data/taskyn.db
      - TASKYN_ACTOR=mcp
      - TASKYN_MCP_HOST=0.0.0.0
      - TASKYN_MCP_PORT=8020

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8020)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy with Auto TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: taskyn-caddy

    # External port (8030 for HTTPS)
    ports:
      - "8030:8030"

    # Mount Caddyfile and certificate storage
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    # Domain configuration
    environment:
      - DOMAIN=${DOMAIN:-localhost}

    # Wait for Taskyn to be healthy
    depends_on:
      taskyn:
        condition: service_healthy

    # Restart policy
    restart: unless-stopped

# Named volumes for Caddy certificate storage
volumes:
  caddy_data:
  caddy_config:
